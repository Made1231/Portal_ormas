<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Portal Ormas Kesbangpol Banjarmasin</title>
    <meta name="description" content="Halaman login administrator Portal Pendataan Ormas Kesbangpol Kota Banjarmasin.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body {
            background: #0a0f1e;
            min-height: 100vh;
            overflow-y: auto;
        }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            animation: orb-float 8s ease-in-out infinite;
            pointer-events: none;
        }
        .orb-1 { width: 500px; height: 500px; background: radial-gradient(circle, rgba(250,129,18,0.25) 0%, transparent 70%); top: -150px; left: -150px; animation-delay: 0s; }
        .orb-2 { width: 400px; height: 400px; background: radial-gradient(circle, rgba(79,70,229,0.20) 0%, transparent 70%); bottom: -100px; right: -100px; animation-delay: -3s; }
        .orb-3 { width: 300px; height: 300px; background: radial-gradient(circle, rgba(250,129,18,0.12) 0%, transparent 70%); top: 40%; left: 60%; animation-delay: -5s; }
        @keyframes orb-float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.05); }
            66% { transform: translate(-20px, 20px) scale(0.97); }
        }
        .glass-card {
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 32px 64px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
        }
        .input-field {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
        }
        .input-field::placeholder { color: rgba(255,255,255,0.3); }
        .input-field:focus {
            background: rgba(250,129,18,0.08);
            border-color: rgba(250,129,18,0.5);
            box-shadow: 0 0 0 4px rgba(250,129,18,0.15);
            outline: none;
        }
        .btn-login {
            background: linear-gradient(135deg, #FA8112 0%, #e07510 100%);
            box-shadow: 0 8px 24px rgba(250,129,18,0.4);
            transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
        }
        .btn-login:hover {
            box-shadow: 0 12px 32px rgba(250,129,18,0.55);
            transform: translateY(-2px);
        }
        .btn-login:active {
            transform: scale(0.95);
            box-shadow: 0 4px 16px rgba(250,129,18,0.4);
        }
        a { transition: all 0.2s cubic-bezier(0.4,0,0.2,1); }
        a:active { transform: scale(0.95); }
        .dots-pattern {
            background-image: radial-gradient(circle, rgba(255,255,255,0.04) 1px, transparent 1px);
            background-size: 32px 32px;
        }
        @keyframes fade-up {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-up { animation: fade-up 0.6s ease-out forwards; }
        .fade-up-delay { animation: fade-up 0.6s ease-out 0.15s both; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen px-4 relative dots-pattern">

    <!-- Animated Orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <!-- Main Wrapper to stack login card and demo card vertically -->
    <div class="flex flex-col gap-5 w-full max-w-md relative z-10 fade-up my-8">
        <!-- Login Card -->
        <main class="glass-card rounded-3xl w-full">
            <div class="p-8 sm:p-10">

                <!-- Branding -->
                <div class="flex flex-col items-center mb-8 text-center fade-up-delay">
                    <div class="flex items-center space-x-4 mb-6">
                        <a href="https://banjarmasinkota.go.id/" target="_blank" class="w-16 h-16 bg-white/10 rounded-2xl flex items-center justify-center border border-white/15 shadow-lg hover:bg-white/20 transition-colors cursor-pointer" title="Pemerintah Kota Banjarmasin">
                            <img src="img/logo-bjm.png" alt="Logo Banjarmasin" class="h-12 w-12 object-contain">
                        </a>
                        <div class="w-px h-12 bg-white/15"></div>
                        <a href="https://kesbangpol.banjarmasinkota.go.id/" target="_blank" class="w-16 h-16 bg-white/10 rounded-2xl flex items-center justify-center border border-white/15 shadow-lg hover:bg-white/20 transition-colors cursor-pointer" title="Kesbangpol Banjarmasin">
                            <img src="img/logo-kesbangpol.png" alt="Logo Kesbangpol" class="h-12 w-12 object-contain">
                        </a>
                    </div>
                    <h1 class="text-2xl font-bold text-white tracking-tight">Portal Admin</h1>
                    <p class="text-sm text-white/45 mt-1.5 font-medium">Kesbangpol Kota Banjarmasin</p>
                    <div class="mt-4 px-4 py-1.5 bg-[#FA8112]/10 border border-[#FA8112]/25 rounded-full">
                        <span class="text-[#FA8112] text-xs font-semibold tracking-wide uppercase">Akses Terbatas</span>
                    </div>
                </div>

                <!-- Login Form -->
                <form id="login-form" class="space-y-4">
                    <div>
                        <label for="email" class="block text-xs font-semibold text-white/60 uppercase tracking-widest mb-2">Email Administrator</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <svg class="h-4.5 w-4.5 text-white/30" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.206"/>
                                </svg>
                            </div>
                            <input type="email" id="email" name="email"
                                class="input-field pl-11 w-full px-4 py-3.5 rounded-xl text-sm font-medium"
                                placeholder="admin@kesbangpol.go.id" value="admin@intanbjm.com" autocomplete="email" required>
                        </div>
                    </div>

                    <div>
                        <label for="password" class="block text-xs font-semibold text-white/60 uppercase tracking-widest mb-2">Password</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <svg class="h-4.5 w-4.5 text-white/30" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                                </svg>
                            </div>
                            <input type="password" id="password" name="password"
                                class="input-field pl-11 w-full px-4 py-3.5 rounded-xl text-sm font-medium"
                                placeholder="••••••••••••" value="Admin@2024!" autocomplete="current-password" required>
                            <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 pr-4 flex items-center text-white/30 hover:text-white/60 transition-colors">
                                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Error Message -->
                    <div id="error-message" class="hidden">
                        <div class="flex items-center space-x-2.5 bg-red-500/10 border border-red-500/25 rounded-xl px-4 py-3">
                            <svg class="w-4 h-4 text-red-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            </svg>
                            <span id="error-text" class="text-sm font-medium text-red-400">Email atau password salah!</span>
                        </div>
                    </div>

                    <button type="submit" id="login-btn" class="btn-login w-full text-white font-bold py-4 px-6 rounded-xl text-sm mt-2">
                        Masuk Sekarang
                    </button>
                </form>

                <div class="mt-6 text-center">
                    <a href="index.html" class="inline-flex items-center text-sm text-white/30 hover:text-[#FA8112] transition-colors duration-200 font-medium">
                        <svg class="w-3.5 h-3.5 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                        </svg>
                        Kembali ke Portal Publik
                    </a>
                </div>
            </div>

            <!-- Bottom accent -->
            <div class="h-1 w-full bg-gradient-to-r from-transparent via-[#FA8112] to-transparent opacity-40 rounded-b-3xl"></div>
        </main>

        <!-- Demo Accounts Card -->
        <section class="glass-card rounded-3xl w-full p-6 sm:p-8 flex flex-col items-center">
            <h2 class="text-md font-bold text-white/80 tracking-wide mb-4">Akun Demo:</h2>
            <div class="w-full space-y-3.5">
                <!-- Admin Account -->
                <div class="flex items-center justify-between p-3.5 rounded-2xl bg-white/5 border border-white/10 hover:bg-white/10 hover:border-white/20 transition-all duration-300">
                    <div class="text-left">
                        <div class="text-xs font-bold text-[#FA8112] uppercase tracking-wider mb-0.5">Admin</div>
                        <div class="text-sm font-medium text-white/70 font-mono">admin@intanbjm.com</div>
                    </div>
                    <button onclick="autofill('admin@intanbjm.com', 'Admin@2024!')" class="px-4 py-2 bg-[#FA8112] hover:bg-[#e07510] text-white text-xs font-bold rounded-xl transition duration-200 shadow-md active:scale-95">
                        Autofill
                    </button>
                </div>

                <!-- User Account 1 -->
                <div class="flex items-center justify-between p-3.5 rounded-2xl bg-white/5 border border-white/10 hover:bg-white/10 hover:border-white/20 transition-all duration-300">
                    <div class="text-left">
                        <div class="text-xs font-bold text-indigo-400 uppercase tracking-wider mb-0.5">User 1</div>
                        <div class="text-sm font-medium text-white/70 font-mono">user1@devstore.com</div>
                    </div>
                    <button onclick="autofill('user1@devstore.com', 'password')" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-xl transition duration-200 shadow-md active:scale-95">
                        Autofill
                    </button>
                </div>
            </div>
            
            <div class="mt-4 text-center">
                <span class="text-xs font-semibold text-white/40 uppercase tracking-widest">Password:</span>
                <code class="ml-1 text-xs font-mono font-bold text-[#FA8112] bg-[#FA8112]/10 px-2 py-1 rounded">Admin@2024! / password</code>
            </div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Autofill credentials
        window.autofill = function(email, password) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = password;
            const loginBtn = document.getElementById('login-btn');
            if (loginBtn) {
                loginBtn.focus();
            }
        };

        // Toggle password visibility
        document.getElementById('toggle-password').addEventListener('click', function() {
            const pw = document.getElementById('password');
            pw.type = pw.type === 'password' ? 'text' : 'password';
        });
    </script>
</body>
</html>
