<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Admin - INTAN BJM</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 40px;
            width: 420px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        h1 { color: #fff; font-size: 22px; margin-bottom: 8px; text-align: center; }
        .subtitle { color: rgba(255,255,255,0.5); font-size: 13px; text-align: center; margin-bottom: 30px; }
        label { display: block; color: rgba(255,255,255,0.7); font-size: 13px; margin-bottom: 6px; margin-top: 16px; }
        input {
            width: 100%; padding: 12px 16px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px; color: #fff; font-size: 14px;
            outline: none; transition: border-color 0.2s;
        }
        input:focus { border-color: #4f8ef7; }
        button {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #4f8ef7, #9b59b6);
            border: none; border-radius: 10px; color: #fff;
            font-size: 15px; font-weight: 600; cursor: pointer;
            margin-top: 24px; transition: opacity 0.2s;
        }
        button:hover { opacity: 0.85; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #result { margin-top: 20px; padding: 16px; border-radius: 10px; font-size: 13px; display: none; }
        #result.success { background: rgba(46,213,115,0.15); border: 1px solid rgba(46,213,115,0.4); color: #2ed573; }
        #result.error { background: rgba(255,71,87,0.15); border: 1px solid rgba(255,71,87,0.4); color: #ff4757; }
        .cred-box { background: rgba(79,142,247,0.1); border: 1px solid rgba(79,142,247,0.3); border-radius: 10px; padding: 14px; margin-top: 12px; }
        .cred-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13px; }
        .cred-label { color: rgba(255,255,255,0.5); }
        .cred-value { color: #4f8ef7; font-weight: 600; }
        .warning { background: rgba(255,165,0,0.1); border: 1px solid rgba(255,165,0,0.3); border-radius: 10px; padding: 12px; color: rgba(255,165,0,0.9); font-size: 12px; margin-top: 20px; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Setup Akun Admin</h1>
        <p class="subtitle">Buat akun admin baru untuk INTAN BJM</p>
        <label for="email">Email Admin</label>
        <input type="email" id="email" value="admin@intanbjm.com" placeholder="email@domain.com">
        <label for="password">Password</label>
        <input type="password" id="password" value="Admin@2024!" placeholder="Minimal 6 karakter">
        <label for="confirm">Konfirmasi Password</label>
        <input type="password" id="confirm" value="Admin@2024!" placeholder="Ulangi password">
        <button id="createBtn" onclick="createAdmin()">Buat Akun Admin</button>
        <div id="result"></div>
        <div class="warning">Hapus file setup-admin.html ini setelah selesai!</div>
    </div>
    <script>
        const client = supabase.createClient(
            'https://lretyhprnslixkowrdcg.supabase.co',
            'sb_publishable_wRh_VwTQerGgWwSz3nooag_UczlP8sW'
        );
        async function createAdmin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;
            const btn = document.getElementById('createBtn');
            document.getElementById('result').style.display = 'none';
            if (!email || !password) return showResult('error', 'Email dan password tidak boleh kosong!');
            if (password !== confirm) return showResult('error', 'Konfirmasi password tidak cocok!');
            if (password.length < 6) return showResult('error', 'Password minimal 6 karakter!');
            btn.disabled = true; btn.textContent = 'Membuat akun...';
            try {
                const { data, error } = await client.auth.signUp({ email, password });
                if (error) throw error;
                showResult('success', '<strong>Akun admin berhasil dibuat!</strong><br><br>Simpan kredensial berikut:<div class="cred-box"><div class="cred-row"><span class="cred-label">Email</span><span class="cred-value">' + email + '</span></div><div class="cred-row"><span class="cred-label">Password</span><span class="cred-value">' + password + '</span></div></div><br><a href="login.html" style="color:#4f8ef7">Login sekarang</a>');
            } catch(err) {
                showResult('error', 'Gagal: ' + err.message);
            } finally { btn.disabled = false; btn.textContent = 'Buat Akun Admin'; }
        }
        function showResult(type, msg) {
            const r = document.getElementById('result');
            r.className = type; r.innerHTML = msg; r.style.display = 'block';
        }
    </script>
</body>
</html>
